[project]
name = "local-ledger"
version = "0.1.0"
description = "Local-first personal budget app with local/cloud LLM evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.40",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "pandas>=2.2",
    "openai>=1.40",
    "instructor>=1.4",
    "pydantic>=2.7",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://example.invalid/local-ledger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real external services (e.g. Ollama); deselected by default",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:streamlit.*",
    "ignore::DeprecationWarning:pyarrow.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF012"]
"app_pages/**" = ["SIM117"]
